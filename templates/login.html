{% extends "base.html" %}

{% block title %}User Login - ParkVoice AI{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px;">
        <svg viewBox="0 0 24 24" width="28" height="28">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/>
        </svg>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800;">Welcome Back</h2>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.3rem;">Sign in to control your parking with your voice</p>
    </div>

    <!-- Pre-fill helper -->
    <div style="background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.25); border-radius: var(--radius-sm); padding: 0.75rem 1rem; font-size: 0.8rem; margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <strong style="color: #a5b4fc;">Demo Account:</strong> demo@parkvoice.ai / User@123
      </div>
      <button type="button" class="btn btn-secondary btn-sm" onclick="prefillDemoUser()" style="padding: 2px 8px; font-size: 0.75rem;">Fill</button>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@domain.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Sign In to Dashboard
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
      Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one here</a>
    </div>

    <div style="text-align: center; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle); font-size: 0.8rem;">
      <a href="{{ url_for('admin_login') }}" style="color: var(--text-muted); text-decoration: none;">Switch to Admin Simulation Portal &rarr;</a>
    </div>
  </div>
</div>

<script>
function prefillDemoUser() {
  document.getElementById('email').value = 'demo@parkvoice.ai';
  document.getElementById('password').value = 'User@123';
}
</script>
{% endblock %}
