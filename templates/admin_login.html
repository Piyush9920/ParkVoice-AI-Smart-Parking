{% extends "base.html" %}

{% block title %}Admin Portal Login - ParkVoice AI{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 30px rgba(239, 68, 68, 0.15);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="white">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: #fca5a5;">Admin Telemetry Portal</h2>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.3rem;">Access Live Simulation Mode & Real-time Analytics</p>
    </div>

    <!-- Pre-fill helper -->
    <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: var(--radius-sm); padding: 0.75rem 1rem; font-size: 0.8rem; margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <strong style="color: #fca5a5;">Admin Credentials:</strong> admin / Admin@123
      </div>
      <button type="button" class="btn btn-secondary btn-sm" onclick="prefillAdmin()" style="padding: 2px 8px; font-size: 0.75rem;">Fill</button>
    </div>

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label class="form-label" for="username">Admin Username or Email</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="admin or admin@parkvoice.ai" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Admin Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-danger" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Authenticate as Admin
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem;">
      <a href="{{ url_for('login') }}" style="color: var(--text-secondary); text-decoration: none;">&larr; Back to Regular User Login</a>
    </div>
  </div>
</div>

<script>
function prefillAdmin() {
  document.getElementById('username').value = 'admin';
  document.getElementById('password').value = 'Admin@123';
}
</script>
{% endblock %}
